name: Update DSA Progress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dsa-progress
  cancel-in-progress: false

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate progress graphic
        run: |
          mkdir -p assets

          python3 <<'PY'
          from pathlib import Path
          from html import escape

          def count_problems(root, pattern=None):
              if not root.exists():
                  return 0

              count = 0
              for folder in root.iterdir():
                  if not folder.is_dir():
                      continue

                  if pattern:
                      has_solution = any(
                          p.is_file() and p.match(pattern)
                          for p in folder.iterdir()
                      )
                  else:
                      has_solution = any(
                          p.is_file() for p in folder.rglob("*")
                      )

                  if has_solution:
                      count += 1

              return count

          def make_svg(neetcode, leetcode, total, output):
              percent = min(neetcode / total * 100, 100)
              filled = 660 * percent / 100

              svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
                width="700" height="170" viewBox="0 0 700 170">
                <rect width="700" height="170" rx="14" fill="#0d1117"/>
                <text x="24" y="35" fill="#f0f6fc"
                  font-family="Arial" font-size="20" font-weight="bold">DSA Progress</text>
                <text x="24" y="68" fill="#c9d1d9"
                  font-family="Arial" font-size="16">NeetCode 150</text>
                <text x="680" y="68" text-anchor="end" fill="#c9d1d9"
                  font-family="Arial" font-size="16">{neetcode} / {total} solved ({percent:.1f}%)</text>
                <rect x="20" y="78" width="660" height="14"
                  rx="7" fill="#30363d"/>
                <rect x="20" y="78" width="{filled:.2f}" height="14"
                  rx="7" fill="#3fb950"/>
                <rect x="20" y="112" width="660" height="1" fill="#30363d"/>
                <text x="24" y="145" fill="#c9d1d9"
                  font-family="Arial" font-size="16">LeetCode</text>
                <text x="680" y="145" text-anchor="end" fill="#c9d1d9"
                  font-family="Arial" font-size="16">{leetcode} solved</text>
              </svg>'''

              Path(output).write_text(svg)
              print(f"NeetCode: {neetcode}/{total} ({percent:.1f}%), LeetCode: {leetcode}")

          leetcode = count_problems(Path("LeetCode"))
          neetcode = count_problems(
              Path("Data Structures & Algorithms"),
              "submission-*"
          )

          make_svg(neetcode, leetcode, 150, "assets/dsa-progress.svg")
          PY

      - name: Commit updated graphic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm --cached --ignore-unmatch -q assets/leetcode-progress.svg \
                  assets/neetcode-progress.svg
          git add assets/dsa-progress.svg

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update DSA progress graphic"

          # A newer push can land while this job runs; rebase onto it and retry.
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((attempt * 2))
          done
          exit 1
