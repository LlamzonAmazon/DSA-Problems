name: Update DSA Progress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dsa-progress
  cancel-in-progress: false

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate progress graphic
        run: |
          mkdir -p assets

          python3 <<'PY'
          from pathlib import Path
          from html import escape

          def count_problems(root, pattern=None):
              if not root.exists():
                  return 0

              count = 0
              for folder in root.iterdir():
                  if not folder.is_dir():
                      continue

                  if pattern:
                      has_solution = any(
                          p.is_file() and p.match(pattern)
                          for p in folder.iterdir()
                      )
                  else:
                      has_solution = any(
                          p.is_file() for p in folder.rglob("*")
                      )

                  if has_solution:
                      count += 1

              return count

          def make_svg(neetcode, leetcode, total, output_dir):
              percent = min(neetcode / total * 100, 100)
              font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"
              # GitHub Primer values: border, muted text, ProgressBar track and success fill
              light = "--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--track:#818b981f;--fill:#1f883d"
              dark = "--fg:#f0f6fc;--muted:#9198a1;--line:#3d444d;--track:#656c7633;--fill:#238636"
              variants = {
                  "dsa-progress-light.svg": f":root{{{light}}}",
                  "dsa-progress-dark.svg": f":root{{{dark}}}",
                  "dsa-progress.svg": f":root{{{light}}} @media (prefers-color-scheme: dark){{:root{{{dark}}}}}",
              }
              filled = 712 * percent / 100
              bar = f'<rect x="24" y="48" width="{filled:.2f}" height="8" fill="var(--fill)"/>' if filled else ""

              for name, css in variants.items():
                  svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="760" height="124" viewBox="0 0 760 124" role="img">
                <style>{css} text{{font-family:{font};font-size:14px;font-variant-numeric:tabular-nums}}</style>
                <rect x=".5" y=".5" width="759" height="123" fill="none" stroke="var(--line)"/>
                <text x="24" y="34" fill="var(--fg)" font-weight="600">NeetCode 150</text>
                <text x="736" y="34" text-anchor="end" fill="var(--muted)">{neetcode} / {total} solved · {percent:.1f}%</text>
                <rect x="24" y="48" width="712" height="8" fill="var(--track)"/>
                {bar}
                <rect x="24" y="76" width="712" height="1" fill="var(--line)"/>
                <text x="24" y="104" fill="var(--fg)" font-weight="600">LeetCode</text>
                <text x="736" y="104" text-anchor="end" fill="var(--muted)">{leetcode} solved</text>
              </svg>'''
                  Path(output_dir, name).write_text(svg)
              print(f"NeetCode: {neetcode}/{total} ({percent:.1f}%), LeetCode: {leetcode}")

          leetcode = count_problems(Path("LeetCode"))
          neetcode = count_problems(
              Path("Data Structures & Algorithms"),
              "submission-*"
          )

          make_svg(neetcode, leetcode, 150, "assets")
          PY

      - name: Commit updated graphic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm --cached --ignore-unmatch -q assets/leetcode-progress.svg \
                  assets/neetcode-progress.svg
          git add assets/dsa-progress.svg assets/dsa-progress-light.svg assets/dsa-progress-dark.svg

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update DSA progress graphic"

          # A newer push can land while this job runs; rebase onto it and retry.
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((attempt * 2))
          done
          exit 1
